<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="carGradient" x1="40" y1="40" x2="220" y2="220">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFB547"/>
    </linearGradient>

    <linearGradient id="lensGradient" x1="120" y1="90" x2="220" y2="200">
      <stop offset="0%" stop-color="#FFD66E"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Car -->
  <g filter="url(#shadow)">
    <path
      d="M48 146
         C58 124 76 108 104 102
         L146 94
         C170 90 184 98 198 118
         L214 142
         C220 150 220 162 214 168
         L202 168
         C198 182 186 192 170 192
         C154 192 142 182 138 168
         L108 168
         C104 182 92 192 76 192
         C60 192 48 182 44 168
         L40 168
         C34 168 30 164 30 158
         L30 152
         C30 148 34 146 40 146
         Z"
      fill="url(#carGradient)"
    />

    <!-- Windows -->
    <path
      d="M82 118
         L140 108
         C156 106 168 112 176 126
         L96 126
         Z"
      fill="white"
      opacity=".28"
    />

    <!-- Wheels -->
    <circle cx="76" cy="170" r="18" fill="#222"/>
    <circle cx="170" cy="170" r="18" fill="#222"/>
    <circle cx="76" cy="170" r="8" fill="#ECECEC"/>
    <circle cx="170" cy="170" r="8" fill="#ECECEC"/>
  </g>

  <!-- Lens -->
  <g filter="url(#shadow)">
    <circle
      cx="182"
      cy="82"
      r="34"
      fill="url(#lensGradient)"
      stroke="white"
      stroke-width="8"
    />

    <circle
      cx="182"
      cy="82"
      r="17"
      stroke="white"
      stroke-width="4"
      opacity=".9"
    />

    <rect
      x="204"
      y="104"
      width="14"
      height="42"
      rx="7"
      transform="rotate(-45 204 104)"
      fill="url(#lensGradient)"
    />
  </g>

</svg>